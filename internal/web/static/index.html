<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>Chronicle · Infrastructure time machine</title>
  <link rel="stylesheet" href="/app.css?v=4">
  <link rel="stylesheet" href="/theme.css?v=2">
  <link rel="stylesheet" href="/graph.css?v=1">
  <link rel="stylesheet" href="/graph-controls.css?v=2">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">C</span><span>chronicle</span></div>
      <div class="workspace-label">OPERATIONS</div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div class="system-state"><span class="dot dot-amber"></span><span><strong>Dry-run mode</strong><small>Healing execution disabled</small></span></div>
        <div class="environment"><span>ENVIRONMENT</span><code>local / kind</code></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="crumb">CHRONICLE</span><span class="slash">/</span><span id="page-label">Overview</span></div>
        <div class="top-actions"><span class="live-indicator"><span class="dot dot-green"></span>Collectors online</span><button class="icon-button" id="refresh" title="Refresh data">↻</button><div class="avatar">KS</div></div>
      </header>
      <div id="app" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js?v=3"></script>
  <script src="/replay.js?v=1"></script>
  <script src="/graph.js?v=4"></script>
</body>
</html>
