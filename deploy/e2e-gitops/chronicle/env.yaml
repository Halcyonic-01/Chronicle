apiVersion: apps/v1
kind: Deployment
metadata: {name: chronicle, namespace: chronicle}
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: chronicle
          env:
            - {name: KAFKA_BROKERS, value: ""}
            - {name: PROMETHEUS_URL, value: "http://prometheus.monitoring.svc:9090"}
            - {name: LOKI_URL, value: "http://127.0.0.1:1"}
            - {name: HEAL_LIVE_ENABLED, value: "true"}
            - {name: HEAL_KILL_SWITCH, value: "false"}
            # A new cluster has no history: the observation and evidence gates are
            # waived here only. Floors, approval and allowlists are unchanged.
            - {name: HEAL_OBSERVATION_STARTED_AT, value: "2026-01-01T00:00:00Z"}
            - {name: HEAL_MIN_DECISIVE_DECISIONS, value: "0"}
            - {name: HEAL_MIN_PRECISION, value: "0"}
            - {name: HEAL_ALLOWED_NAMESPACES, value: default}
            - {name: HEAL_ALLOWED_ACTIONS, value: "git_revert,restore_replicas,rollback_deployment"}
            - {name: HEAL_ALLOWED_TARGETS, value: "default/victim"}
            - {name: HEAL_ROLLBACK_MIN_HEALTHY, value: 60s}
            - {name: HEAL_GIT_REMEDIATION_ENABLED, value: "true"}
            - {name: HEAL_GIT_API_URL, value: "http://gitea-http.gitea.svc:3000/api/v1"}
            - {name: HEAL_GIT_ALLOWED_REPOS, value: "http://gitea-http.gitea.svc:3000/acme/gitops.git"}
            - {name: HEAL_GIT_USERNAME, value: chronicle}
