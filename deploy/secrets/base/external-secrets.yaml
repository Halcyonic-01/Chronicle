# Chronicle's secrets, delivered by External Secrets Operator. Chronicle itself
# is unchanged: it reads Kubernetes Secrets as environment variables, and ESO
# keeps those Secrets filled from the backend named by the ClusterSecretStore
# (see the aws/ and fake/ overlays). No value appears in this repository.
#
# The backend holds ONE JSON secret per environment whose keys are the variable
# names (RCA_API_KEY, GITHUB_TOKEN, SLACK_WEBHOOK_URL, ...); every key is
# optional, as in the Deployment. The database password is a second secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-config
  namespace: chronicle
spec:
  # How soon a rotated value reaches the Secret; the pods restart on the change
  # (stakater/reloader, see the annotations on the Deployment).
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: chronicle}
  target:
    name: chronicle-config
    # Take over nothing that exists, and leave the Secret alone if this object is
    # deleted: removing the ExternalSecret must not take Chronicle's config away.
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: {key: chronicle/config}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-postgresql
  namespace: chronicle
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: chronicle}
  target:
    name: postgres-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: postgres-password
      remoteRef: {key: chronicle/postgres, property: password}
