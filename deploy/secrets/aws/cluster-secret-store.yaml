# AWS Secrets Manager on EKS. ESO authenticates with the pod's own AWS identity,
# so no AWS key is stored anywhere: associate the IAM role in iam-policy.json
# with the external-secrets ServiceAccount (EKS Pod Identity), or annotate that
# ServiceAccount with the role (IRSA) and uncomment the auth block.
#
# NOT TESTED against a real AWS account: this repository's tests ran only against
# the fake provider on kind.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: chronicle
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2   # the cluster's region; change with it
      # auth:
      #   jwt:
      #     serviceAccountRef: {name: external-secrets, namespace: external-secrets}
