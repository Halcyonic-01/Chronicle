# ESO's fake provider, for kind only: the values live in this object, so they are
# test values and must never be real. Editing a value here is how a rotation is
# rehearsed (scripts/test-secret-rotation.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: chronicle
spec:
  provider:
    fake:
      data:
        - key: chronicle/config
          value: '{"SLACK_WEBHOOK_URL":"https://hooks.invalid/test-1","PAGER_WEBHOOK_URL":"https://pager.invalid/test-1"}'
        - key: chronicle/postgres
          value: '{"password":"postgres"}'
