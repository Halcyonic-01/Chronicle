apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cluster-secret-store.yaml
patches:
  # On kind the PostgreSQL chart owns its own Secret, and ESO will not adopt one
  # it did not create. In production the database is managed and has no such Secret.
  - target: {kind: ExternalSecret, name: postgres-postgresql}
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: postgres-postgresql
