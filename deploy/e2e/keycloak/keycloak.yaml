apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.6.4
        args: ["start-dev", "--import-realm"]
        env:
        # One issuer for the browser, the harness and Chronicle; see README.
        - {name: KC_HOSTNAME, value: "http://keycloak.localhost:8180"}
        - {name: KC_HEALTH_ENABLED, value: "true"}
        - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=65"}
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom: {secretKeyRef: {name: keycloak-admin, key: username}}
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
        ports:
        - {name: http, containerPort: 8080}
        - {name: management, containerPort: 9000}
        readinessProbe:
          httpGet: {path: /health/ready, port: management}
          periodSeconds: 5
          failureThreshold: 60
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 900Mi}
        volumeMounts:
        - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
      - name: realm
        configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: {app: keycloak}
  ports:
  - {name: http, port: 8180, targetPort: http}
