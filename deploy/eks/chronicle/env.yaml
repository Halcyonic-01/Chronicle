# This cluster's values over the production overlay's placeholders.
# POSTGRES_URL is not here: the Argo CD Application patches it in from
# Terraform, so the database host and user stay out of Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle
  namespace: chronicle
spec:
  template:
    spec:
      containers:
        - name: chronicle
          env:
            - {name: PROMETHEUS_URL, value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"}
            - {name: LOKI_URL, value: "http://loki.monitoring.svc:3100"}
            # Dry-run needs no identity provider: empty issuer = OIDC off.
            - {name: OIDC_ISSUER_URL, value: ""}
            - {name: OIDC_CLIENT_ID, value: ""}
            - {name: OIDC_ALLOWED_GROUPS, value: ""}
            # Reached through kubectl port-forward.
            - {name: CHRONICLE_PUBLIC_URL, value: "http://localhost:8181"}
