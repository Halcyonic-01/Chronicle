apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Runs on the chaos-target node when there is one (scripts/setup.sh), so a
      # lost-node experiment hits redis alone; anywhere otherwise.
      tolerations:
      - key: chronicle.io/chaos-target
        operator: Equal
        value: "true"
        effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: chronicle.io/chaos-target
                operator: In
                values: ["true"]
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        # Readiness only. A redis that stops answering turns unready and stays
        # so, which is the deadlock restart_pod exists for (redis-deadlocked).
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
---
# Voluntary disruptions may not take the only healthy redis. An unready one
# may still be evicted (AlwaysAllow), so restarting a deadlocked pod works.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: redis
