apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: chronicle-victim:latest
        imagePullPolicy: Never
        command: ["/api"]
        env:
        - name: WORKER_URL
          value: "http://worker:8080"
        - name: REDIS_URL
          value: "redis:6379"
        ports:
        - name: http
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  ports:
  - name: http
    port: 8080
  selector:
    app: api
