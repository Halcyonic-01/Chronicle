# Production settings. HEAL_LIVE_ENABLED is deliberately not set here: the base
# keeps it false, and a test fails if this overlay turns it on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle
  namespace: chronicle
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          env:
            - name: POSTGRES_URL
              value: postgres://CHANGE-ME-db-user:$(POSTGRES_PASSWORD)@CHANGE-ME-db-host:5432/CHANGE-ME-db-name?sslmode=require
      containers:
        - name: chronicle
          imagePullPolicy: IfNotPresent
          env:
            - {name: CHRONICLE_ENVIRONMENT, value: production}
            - name: POSTGRES_URL
              value: postgres://CHANGE-ME-db-user:$(POSTGRES_PASSWORD)@CHANGE-ME-db-host:5432/CHANGE-ME-db-name?sslmode=require
            - {name: KAFKA_BROKERS, value: ""}   # no Kafka: events go straight to PostgreSQL
            - {name: PROMETHEUS_URL, value: "CHANGE-ME-prometheus-url"}
            - {name: LOKI_URL, value: "CHANGE-ME-loki-url"}
            - {name: OIDC_ISSUER_URL, value: "CHANGE-ME-oidc-issuer-url"}
            - {name: OIDC_CLIENT_ID, value: "CHANGE-ME-oidc-client-id"}
            - {name: OIDC_ALLOWED_GROUPS, value: "CHANGE-ME-approver-group"}
            - {name: CHRONICLE_PUBLIC_URL, value: "CHANGE-ME-console-url"}
