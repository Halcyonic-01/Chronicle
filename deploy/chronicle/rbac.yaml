apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronicle
  namespace: chronicle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chronicle
rules:
# Chronicle never reads Secret contents. Secrets appear in the dependency graph
# only through the pod specs that reference them, so cluster-wide read access to
# every Secret in the cluster is deliberately NOT granted here.
- apiGroups: ["", "apps", "networking.k8s.io"]
  resources: ["pods", "events", "services", "nodes", "configmaps", "persistentvolumeclaims", "deployments", "ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "update", "patch"]
# Read-only. The replica-restore action refuses to write spec.replicas when an
# autoscaler already owns that field, and it needs to see the HPAs to know.
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chronicle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chronicle
subjects:
- kind: ServiceAccount
  name: chronicle
  namespace: chronicle
